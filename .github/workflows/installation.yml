name: Native installation
on:
  push:
    branches: [main, codex/cross-platform-install, codex/codex-skill-validation]
    paths-ignore: ['CHANGELOG.md', 'backup-manifest.json', 'references/cross-platform-validation.md', 'references/codex-validation.md', 'references/delivery-status.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Clean source and compiled installation
        run: node scripts/native-validation.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installation-${{ matrix.os }}
          path: ${{ runner.temp }}/community-validation/*.json
          if-no-files-found: error
          retention-days: 14

  codex:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: codex
          - os: windows-latest
            executable: codex.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source dependencies
        run: npm ci
      - name: Build the downloaded source
        run: npm run build
      - name: Install Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          if [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --proc /proc true
      - name: Provision pinned external Codex runtime
        run: node scripts/run-python.mjs scripts/install_codex.py --out "${{ runner.temp }}/community-codex-runtime"
      - name: Signed-out discovery and scripted protocol execution
        run: node scripts/check_codex.mjs --codex "${{ runner.temp }}/community-codex-runtime/${{ matrix.executable }}" --out "${{ runner.temp }}/community-codex-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: codex-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/community-codex-report.json
            ${{ runner.temp }}/community-codex-runtime/runtime.json
          if-no-files-found: error
          retention-days: 14
